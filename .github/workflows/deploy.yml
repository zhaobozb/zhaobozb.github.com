# Deploys the static site in site/ to GitHub Pages.
# The site is plain HTML/CSS, so there is no build step: the folder is uploaded as-is.
name: Deploy site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_DIR: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check local links
        # Fails the deploy if the site links to a file that does not exist.
        run: python3 tools/check_links.py "$SITE_DIR"

      - name: Stamp last-updated date
        # Writes the latest commit's month and year into the homepage footer ("November 2026"),
        # so it never needs hand-editing.
        run: |
          page="$SITE_DIR/index.html"
          iso=$(git log -1 --format=%cs)          # e.g. 2026-11-22
          month=${iso%-*}                         # e.g. 2026-11
          human=$(date -u -d "$iso" '+%B %Y')     # e.g. November 2026
          year=${iso%%-*}
          sed -i -E \
            -e "s#<time class=\"last-updated\" datetime=\"[^\"]*\">[^<]*</time>#<time class=\"last-updated\" datetime=\"$month\">$human</time>#" \
            -e "s#<span class=\"copyright-year\">[^<]*</span>#<span class=\"copyright-year\">$year</span>#" \
            "$page"
          grep -q "datetime=\"$month\">$human</time>" "$page" || { echo "::error::Footer date placeholder not found in $page"; exit 1; }
          echo "Footer stamped: $human"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
